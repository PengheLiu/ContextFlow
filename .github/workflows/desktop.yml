name: Desktop builds and isolated smoke tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'src/**'
      - 'tools/prepare-desktop.mjs'
      - 'tools/node-license.mjs'
      - 'tools/package-desktop.mjs'
      - 'tools/smoke-desktop.mjs'
      - 'assets/trayTemplate*'
      - 'test/*desktop*'
      - 'test/platform.test.mjs'
      - 'test/secrets.test.mjs'
      - 'test/node-license.test.mjs'
      - 'test/native-*.test.mjs'
      - 'tools/check-desktop-package.mjs'
      - 'tools/check-product-release.mjs'
      - 'product/**'
      - 'package*.json'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run desktop:install
      - run: npm run check:product
      - run: npm run test:product
      - run: npm run test:desktop
      - run: npm run desktop:prepare -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - run: npm run test:desktop:smoke
      - run: npm --prefix desktop run dist -- --${{ matrix.platform == 'darwin' && 'mac' || 'win' }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node tools/check-desktop-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contextflow-desktop-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.sha256
          if-no-files-found: error
          retention-days: 14
